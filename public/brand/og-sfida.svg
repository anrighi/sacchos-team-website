<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a2634"/>
  <!-- Pink accent bar top-left -->
  <rect x="0" y="0" width="6" height="630" fill="#f867a5"/>
  <!-- Subtle pink glow top-right -->
  <ellipse cx="980" cy="120" rx="380" ry="260" fill="#f867a5" fill-opacity="0.06"/>
  <!-- Diagonal field lines -->
  <line x1="520" y1="0" x2="760" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="600" y1="0" x2="840" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="680" y1="0" x2="920" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="440" y1="0" x2="680" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <!-- Two crossed swords icon -->
  <g transform="translate(80, 68)" opacity="0.9">
    <!-- sword 1 -->
    <rect x="58" y="0" width="8" height="130" rx="2" fill="#f867a5" transform="rotate(40 62 65)"/>
    <polygon points="62,0 56,20 68,20" fill="#f867a5" transform="rotate(40 62 65)"/>
    <rect x="46" y="98" width="32" height="6" rx="3" fill="rgba(255,255,255,0.6)" transform="rotate(40 62 65)"/>
    <!-- sword 2 -->
    <rect x="58" y="0" width="8" height="130" rx="2" fill="white" fill-opacity="0.7" transform="rotate(-40 62 65)"/>
    <polygon points="62,0 56,20 68,20" fill="white" fill-opacity="0.7" transform="rotate(-40 62 65)"/>
    <rect x="46" y="98" width="32" height="6" rx="3" fill="rgba(255,255,255,0.5)" transform="rotate(-40 62 65)"/>
  </g>
  <!-- Main headline -->
  <text x="80" y="265" font-family="system-ui,-apple-system,Helvetica Neue,sans-serif" font-size="108" font-weight="800" fill="#f867a5" letter-spacing="-2">TI SFIDA</text>
  <!-- Supporting text -->
  <text x="80" y="350" font-family="system-ui,-apple-system,Helvetica Neue,sans-serif" font-size="44" font-weight="400" fill="rgba(255,255,255,0.70)">Schiera la formazione e accetta la sfida.</text>
  <!-- Divider line -->
  <rect x="80" y="400" width="120" height="3" rx="2" fill="#f867a5" fill-opacity="0.6"/>
  <!-- Brand -->
  <text x="80" y="468" font-family="system-ui,-apple-system,Helvetica Neue,sans-serif" font-size="36" font-weight="700" fill="rgba(255,255,255,0.90)" letter-spacing="0.5">SACCHO'S TEAM</text>
  <text x="80" y="514" font-family="system-ui,-apple-system,Helvetica Neue,sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.40)" letter-spacing="3">SCOUTBALL 7v7 · AGESCI PESARO 1</text>
</svg>
