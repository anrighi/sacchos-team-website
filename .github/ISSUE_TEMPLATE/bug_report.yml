name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please redact secrets from logs.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, deploy target
      placeholder: macOS / Node 22 / local

  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main @ abc1234

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
