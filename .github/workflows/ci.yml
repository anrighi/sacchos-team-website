name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          ROSTER_SHEET_CSV_URL: ${{ secrets.ROSTER_SHEET_CSV_URL }}

  deploy-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ROSTER_SHEET_CSV_URL: ${{ secrets.ROSTER_SHEET_CSV_URL }}
      - name: Resolve Cloudflare account
        id: cf
        run: bash scripts/ci-resolve-cloudflare-account.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v3
        if: steps.cf.outputs.has_token == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf.outputs.account_id }}
          command: deploy
          packageManager: pnpm
        env:
          WRANGLER_SEND_METRICS: "false"

  deploy-preview:
    needs: test
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Set preview alias
        run: bash scripts/ci-set-preview-env.sh
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ROSTER_SHEET_CSV_URL: ${{ secrets.ROSTER_SHEET_CSV_URL }}
      - name: Resolve Cloudflare account
        id: cf
        run: bash scripts/ci-resolve-cloudflare-account.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy preview
        if: steps.cf.outputs.has_token == 'true'
        id: deploy
        run: bash scripts/ci-deploy-preview.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          PREVIEW_ALIAS: ${{ env.PREVIEW_ALIAS }}
          WRANGLER_SEND_METRICS: "false"
      - name: Comment staging URL on PR
        if: steps.cf.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          PR="$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' || true)"
          if [[ -z "${PR}" || "${PR}" == "null" ]]; then
            echo "No open PR for $GITHUB_REF_NAME"
            exit 0
          fi
          URL="${DEPLOY_URL:-}"
          if [[ -z "${URL}" ]]; then
            URL="(wrangler non ha emesso deployment-url; vedi i log del job)"
          fi
          BODY="$(printf '<!-- staging-url -->\n**Preview Cloudflare di questo branch:** %s\n\nSi aggiorna a ogni push (non aspetta il merge).\n\nProduzione: https://sacchos.agescipesaro1.it' "$URL")"
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[] | select(.user.login=="github-actions[bot]" and (.body|contains("<!-- staging-url -->"))) | .id' | head -n1 || true)"
          if [[ -n "${EXISTING}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" -f body="${BODY}"
          else
            gh pr comment "${PR}" --body "${BODY}"
          fi
